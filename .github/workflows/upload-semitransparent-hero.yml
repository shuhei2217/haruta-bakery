name: Upload Semi Transparent Hero

on:
  push:
    branches: [ino-bankin-preview]
    paths:
      - '.github/workflows/upload-semitransparent-hero.yml'

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Download hero image
        env:
          HERO_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-27b0-81f5-83df-2299dd8b02e7/raw?se=2026-09-24T05%3A49%3A07Z&sp=r&sv=2026-02-06&sr=b&scid=b087b21e-7fbc-5d38-b14b-ce2d76b41291&skoid=0765b554-4b90-4fa2-9d6d-0055a2427910&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T02%3A35%3A56Z&ske=2026-09-25T02%3A35%3A56Z&sks=b&skv=2026-02-06&sig=Yla3Kxi0oDCY8ZPXrnuuD32lA86y%2BIpPqgrjXc7pbHM%3D'
        run: |
          mkdir -p upload/images
          curl -fL --retry 3 --max-time 60 "$HERO_URL" -o upload/images/hero-semitransparent-v2.png
          test -s upload/images/hero-semitransparent-v2.png
          file upload/images/hero-semitransparent-v2.png

      - name: Install lftp
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y lftp >/dev/null

      - name: Upload image to preview server
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ftp:ssl-allow no;
            set ftp:passive-mode true;
            mkdir -p ino-bankin-preview/images;
            mirror -R --verbose upload/images/ ./ino-bankin-preview/images/;
            bye
          "

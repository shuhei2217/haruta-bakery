name: Verify Visual Upgrade

on:
  push:
    branches: [ino-bankin-preview]
    paths:
      - '.github/workflows/verify-visual-upgrade.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ino-bankin-preview
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Verify live site
        run: |
          mkdir -p verify-visual
          node - <<'NODE'
          const fs=require('fs');
          const { chromium }=require('playwright');
          const url='https://harutabakery.ciao-st.com/site/ino-bankin-preview/?visual=20260924-1945';
          (async()=>{
            const browser=await chromium.launch({headless:true});

            let ready=false;
            for(let i=0;i<24;i++){
              const p=await browser.newPage({viewport:{width:390,height:844}});
              try{
                await p.goto(url+'&probe='+i,{waitUntil:'commit',timeout:20000});
                await p.waitForSelector('body',{timeout:15000});
                const txt=await p.locator('body').innerText();
                if(txt.includes('岐阜市北島に拠点') && txt.includes('板金の技術で支える')){
                  ready=true;
                  await p.close();
                  break;
                }
              }catch(e){}
              await p.close();
              await new Promise(r=>setTimeout(r,10000));
            }
            if(!ready) throw new Error('new visual version did not appear');

            const viewports=[
              {name:'pc',w:1440,h:1000},
              {name:'m375',w:375,h:812},
              {name:'m390',w:390,h:844},
              {name:'m430',w:430,h:900}
            ];
            const results=[];
            for(const vp of viewports){
              const page=await browser.newPage({viewport:{width:vp.w,height:vp.h},deviceScaleFactor:1});
              const errors=[], bad=[];
              page.on('pageerror',e=>errors.push('pageerror:'+e.message));
              page.on('console',m=>{if(m.type()==='error') errors.push('console:'+m.text())});
              page.on('response',r=>{if(r.status()>=400) bad.push(r.status()+' '+r.url())});
              await page.goto(url+'&vp='+vp.w,{waitUntil:'commit',timeout:30000}).catch(()=>{});
              await page.waitForFunction(()=>document.querySelector('.trust-band')&&document.querySelector('.craft-focus')&&document.querySelector('.service-story'),null,{timeout:30000});
              await page.evaluate(()=>{document.documentElement.style.scrollBehavior='auto'});
              await page.waitForTimeout(1100);

              const height=await page.evaluate(()=>document.documentElement.scrollHeight);
              for(let y=0;y<height;y+=Math.max(450,Math.floor(vp.h*.72))){
                await page.evaluate(y=>scrollTo(0,y),y);
                await page.waitForTimeout(70);
              }
              await page.evaluate(()=>scrollTo(0,0));
              await page.waitForTimeout(180);

              const base=await page.evaluate(()=> {
                const sticky=document.querySelector('.service-sticky');
                const serviceP=document.querySelector('.service-panel p:not(.service-no)');
                const trust=document.querySelector('.trust-band');
                const craft=document.querySelector('.craft-focus');
                return {
                  innerWidth,
                  scrollWidth:document.documentElement.scrollWidth,
                  trustHeight:Math.round(trust.getBoundingClientRect().height),
                  craftHeight:Math.round(craft.getBoundingClientRect().height),
                  stickyPosition:getComputedStyle(sticky).position,
                  serviceFont:parseFloat(getComputedStyle(serviceP).fontSize),
                  imageErrors:[...document.images].filter(i=>!i.complete||i.naturalWidth===0).map(i=>i.src),
                  tel:[...document.querySelectorAll('a[href^="tel:"]')].map(a=>a.getAttribute('href')),
                  faqCount:document.querySelectorAll('#faq details').length,
                  hasTrust:document.body.innerText.includes('岐阜市北島に拠点'),
                  hasCraft:document.body.innerText.includes('板金の技術で支える'),
                  hasConcern:document.body.innerText.includes('その症状、そのままにせず。') || document.body.innerText.includes('その症状、\nそのままにせず。')
                };
              });

              const faq=page.locator('#faq details').first();
              await faq.locator('summary').click();
              const faqOpen=await faq.evaluate(el=>el.open);

              let menuOk=true;
              if(vp.w<=430){
                await page.locator('.menu-button').click();
                menuOk=await page.locator('.drawer').evaluate(el=>el.classList.contains('open'));
                await page.locator('.drawer-close').click();
              }

              const metrics=await page.locator('.service-story').evaluate(el=>{
                const r=el.getBoundingClientRect();
                return {top:r.top+scrollY,height:r.height};
              });
              const expected=await page.locator('.service-sticky').evaluate(el=>Math.round(parseFloat(getComputedStyle(el).top)||0));
              const samples=[];
              for(const off of [180,350,500]){
                const y=Math.max(0,metrics.top+Math.min(off,metrics.height*.52));
                await page.evaluate(y=>scrollTo(0,y),y);
                await page.waitForTimeout(100);
                samples.push(await page.evaluate(()=>{
                  const s=document.querySelector('.service-sticky');
                  return {top:Math.round(s.getBoundingClientRect().top),scrollY:Math.round(window.scrollY)};
                }));
              }
              const stuck=samples.filter(s=>Math.abs(s.top-expected)<=3).length>=2;

              await page.evaluate(()=>scrollTo(0,0));
              await page.waitForTimeout(120);
              await page.screenshot({path:`verify-visual/${vp.name}-full.png`,fullPage:true});
              results.push({vp,base,faqOpen,menuOk,expected,samples,stuck,errors,bad});

              if(base.scrollWidth!==vp.w) throw new Error(vp.name+' horizontal overflow '+base.scrollWidth);
              if(!base.hasTrust||!base.hasCraft||!base.hasConcern) throw new Error(vp.name+' new visual content missing');
              if(base.imageErrors.length) throw new Error(vp.name+' image errors '+base.imageErrors.join(','));
              if(!base.tel.includes('tel:0582948544')) throw new Error(vp.name+' phone link missing');
              if(!faqOpen) throw new Error(vp.name+' FAQ failed');
              if(!menuOk) throw new Error(vp.name+' menu failed');
              if(!stuck) throw new Error(vp.name+' sticky failed '+JSON.stringify({expected,samples}));
              if(errors.length) throw new Error(vp.name+' JS '+errors.join(' | '));
              if(bad.length) throw new Error(vp.name+' HTTP '+bad.join(' | '));
              if(vp.w<=430 && base.serviceFont<12.4) throw new Error(vp.name+' service text too small '+base.serviceFont);
              await page.close();
            }
            fs.writeFileSync('verify-visual/diagnostic.json',JSON.stringify(results,null,2));
            console.log(JSON.stringify(results,null,2));
            await browser.close();
          })();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: ino-visual-upgrade-check
          path: verify-visual/
          retention-days: 1

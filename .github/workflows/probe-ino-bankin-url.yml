name: Probe Ino Bankin Public URL

on:
  push:
    branches: [ino-bankin-preview]
    paths:
      - '.github/workflows/probe-ino-bankin-url.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ino-bankin-preview

      - name: Probe candidate public URLs
        run: |
          set +e
          result="ino-bankin-preview/probe-result.txt"
          : > "$result"
          urls=(
            "https://harutabakery.ciao-st.com/site/ino-bankin-preview/"
            "https://harutabakery.ciao-st.com/ino-bankin-preview/"
            "https://ciao-st.com/harutabakery/site/ino-bankin-preview/"
            "https://ciao-st.com/harutabakery/ino-bankin-preview/"
            "https://ciao-st.com/ino-bankin-preview/"
          )
          for url in "${urls[@]}"; do
            body="$(mktemp)"
            info="$(curl -L --max-time 20 -sS -o "$body" -w '%{http_code} %{url_effective}' "$url" 2>&1)"
            marker="no"
            if grep -q "井野板金工業" "$body" 2>/dev/null; then marker="yes"; fi
            printf '%s | %s | marker=%s\n' "$url" "$info" "$marker" >> "$result"
            rm -f "$body"
          done
          cat "$result"

      - name: Commit probe result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ino-bankin-preview/probe-result.txt
          git commit -m "Record Ino Bankin public URL probe" || exit 0
          git push origin HEAD:ino-bankin-preview

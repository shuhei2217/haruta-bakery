name: Verify Ino Improvement

on:
  push:
    branches: [ino-bankin-preview]
    paths:
      - '.github/workflows/verify-ino-improvement.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ino-bankin-preview
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Verify PC and mobile
        run: |
          mkdir -p verify
          node - <<'NODE'
          const fs=require('fs');
          const { chromium }=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const viewports=[
              {name:'pc',w:1440,h:1000},
              {name:'m375',w:375,h:812},
              {name:'m390',w:390,h:844},
              {name:'m430',w:430,h:900},
            ];
            const results=[];
            for(const vp of viewports){
              const page=await browser.newPage({viewport:{width:vp.w,height:vp.h},deviceScaleFactor:1});
              const errors=[], badResponses=[];
              page.on('pageerror',e=>errors.push('pageerror:'+e.message));
              page.on('console',m=>{if(m.type()==='error') errors.push('console:'+m.text())});
              page.on('response',r=>{if(r.status()>=400) badResponses.push(r.status()+' '+r.url())});
              let navError=null;
              try{
                await page.goto('https://harutabakery.ciao-st.com/site/ino-bankin-preview/?verify=20260924-1728-'+vp.w,{waitUntil:'commit',timeout:30000});
              }catch(e){ navError=e.message; }
              await page.waitForSelector('body',{state:'attached',timeout:30000});
              await page.waitForFunction(()=>document.querySelector('.service-story') && document.querySelector('#faq'),null,{timeout:30000});
              await page.evaluate(()=>{ document.documentElement.style.scrollBehavior='auto'; });
              await page.waitForTimeout(1500);

              // Trigger every lazy-loaded image before image health checks.
              const pageHeight=await page.evaluate(()=>document.documentElement.scrollHeight);
              for(let y=0;y<pageHeight;y+=Math.max(450,Math.floor(vp.h*.7))){
                await page.evaluate(y=>window.scrollTo(0,y),y);
                await page.waitForTimeout(120);
              }
              await page.evaluate(()=>window.scrollTo(0,document.documentElement.scrollHeight));
              await page.waitForTimeout(800);
              await page.evaluate(()=>window.scrollTo(0,0));
              await page.waitForTimeout(300);

              const base=await page.evaluate(()=>({
                innerWidth,
                scrollWidth:document.documentElement.scrollWidth,
                scrollHeight:document.documentElement.scrollHeight,
                imageErrors:[...document.images].filter(i=>!i.complete||i.naturalWidth===0).map(i=>i.src),
                telHrefs:[...document.querySelectorAll('a[href^="tel:"]')].map(a=>a.getAttribute('href')),
                faqCount:document.querySelectorAll('#faq details').length,
                serviceDisplay:getComputedStyle(document.querySelector('.service-story')).display,
                stickyPosition:getComputedStyle(document.querySelector('.service-sticky')).position,
                leftBasis:getComputedStyle(document.querySelector('.service-sticky')).flexBasis,
                rightBasis:getComputedStyle(document.querySelector('.service-scroll')).flexBasis,
                visibleText:document.body.innerText.includes('建築板金') && document.body.innerText.includes('屋根工事') && document.body.innerText.includes('外壁工事'),
              }));

              // FAQ native open check
              const faq=page.locator('#faq details').first();
              await faq.locator('summary').click();
              const faqOpen=await faq.evaluate(el=>el.open);

              // sticky behavior check using document coordinates, independent of FAQ auto-scroll.
              const storyMetrics=await page.locator('.service-story').evaluate(el=>{
                const r=el.getBoundingClientRect();
                return {top:r.top+window.scrollY,height:r.height};
              });
              const stickyTopCss=await page.locator('.service-sticky').evaluate(el=>parseFloat(getComputedStyle(el).top)||0);
              const samples=[];
              const offsets=[180,350,500].map(v=>Math.min(v,Math.max(160,storyMetrics.height*.52)));
              for(const off of offsets){
                const y=Math.max(0,storyMetrics.top+off);
                await page.evaluate(y=>window.scrollTo(0,y),y);
                await page.waitForTimeout(120);
                const sample=await page.evaluate(()=>{
                  const s=document.querySelector('.service-sticky');
                  const active=document.querySelector('.service-visual.is-active strong');
                  return {
                    actualScrollY:Math.round(window.scrollY),
                    top:Math.round(s.getBoundingClientRect().top),
                    active:active?active.textContent.trim():null
                  };
                });
                samples.push({requested:Math.round(y),...sample});
              }

              await page.evaluate(()=>window.scrollTo(0,0));
              await page.waitForTimeout(150);
              await page.screenshot({path:`verify/${vp.name}-full.png`,fullPage:true});

              results.push({vp,base,faqOpen,stickyTopCss,samples,navError,errors,badResponses});

              if(base.scrollWidth!==vp.w) throw new Error(vp.name+' horizontal overflow '+base.scrollWidth);
              if(base.imageErrors.length) throw new Error(vp.name+' image errors '+base.imageErrors.join(','));
              if(!base.telHrefs.includes('tel:0582948544')) throw new Error(vp.name+' tel missing');
              if(!faqOpen) throw new Error(vp.name+' FAQ failed');
              if(errors.length) throw new Error(vp.name+' JS errors '+errors.join(' | '));
              if(badResponses.length) throw new Error(vp.name+' HTTP errors '+badResponses.join(' | '));
              if(!base.visibleText) throw new Error(vp.name+' service text missing');

              if(vp.w<=430){
                if(base.stickyPosition!=='sticky') throw new Error(vp.name+' mobile sticky disabled: '+base.stickyPosition);
                if(!['40%','150px','156px','172px'].includes(base.leftBasis) && parseFloat(base.leftBasis)<=0) throw new Error(vp.name+' bad left basis '+base.leftBasis);
              }
              if(samples.length>=2){
                const expected=Math.round(stickyTopCss);
                const stuckSamples=samples.filter(s=>Math.abs(s.top-expected)<=3);
                if(stuckSamples.length<2) throw new Error(vp.name+' sticky did not hold '+JSON.stringify({expected,samples}));
              }

              await page.close();
            }
            fs.writeFileSync('verify/diagnostic.json',JSON.stringify(results,null,2));
            console.log(JSON.stringify(results,null,2));
            await browser.close();
          })();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: ino-improvement-verification
          path: verify/
          retention-days: 1

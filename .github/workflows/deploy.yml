name: Deploy to XServer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xserver-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply display fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('フォームの項目は店舗の注文書にならっています。', '')
          s = s.replace('<b>売り切れ次第閉店</b>', '売り切れ次第閉店')
          s = s.replace('<title>haruta bakery｜久留米・八女／毎日70種の焼きたてパン【制作デモ】</title>', '<title>haruta bakery</title>')
          s = s.replace('<meta property="og:title" content="haruta bakery（制作デモ）">', '<meta property="og:title" content="haruta bakery">')
          s = s.replace('<span class="en">haruta bakery — Kurume &amp; Yame</span>', '<span class="en">haruta bakery<br>— Kurume &amp; Yame —</span>')
          s = s.replace('<p class="meta">久留米店 9:30–17:00／水・土休　|　八女店 9:00–16:00／水・土休　|　売り切れ次第閉店　|　お支払いは現金のみ（営業時間は要確認）</p>', '')
          s = s.replace('※この本文は新聞・地域情報サイトなどの公開情報をもとに制作側が書き起こした下書きです。店の投稿・記事の文章を転載したものではなく、最終的な表現は店主の確認が必要です。', '')
          s = s.replace('店舗提供の「外注メニュー表」「注文書（八女店）」の品目・税込価格をもとにしています（要確認）。', '')
          s = s.replace('住所・電話・時間は店舗提供資料と公開情報の参考値です。掲載前に必ず店主へ確認します。', '')
          s = s.replace('※要確認', '')
          s = s.replace('（時間は要確認）', '')
          s = s.replace('（要確認）', '')
          s = s.replace('(時間は要確認)', '')
          s = s.replace('(要確認)', '')
          s = s.replace('BLTEサンド', 'BLTサンド')
          s = s.replace('9:30〜17:00 ／ 売り切れ次第閉店', '9:30〜16:00 ／ 売り切れ次第閉店')
          s = s.replace('9:30〜17:00 ／ <b>売り切れ次第閉店</b>', '9:30〜16:00 ／ <b>売り切れ次第閉店</b>')
          yame_pattern = r'(<h3>八女店</h3>\s*<table>.*?<tr><th>営業</th><td>.*?</td></tr>)'
          if '駐車場あり／店内イートイン可能' not in s:
              s = re.sub(yame_pattern, r'\1\n    <tr><th>設備</th><td>駐車場あり／店内イートイン可能</td></tr>', s, count=1, flags=re.S)
          s = re.sub(r'<[^>]+>\s*抹茶のダマンドクロワッサン\s*</[^>]+>\s*<[^>]+>\s*[¥￥]?\s*350\s*円?\s*</[^>]+>', '', s)
          s = re.sub(r'<option([^>]*)>\s*抹茶のダマンドクロワッサン(?:\s*[（(]?[¥￥]?350円?[）)]?)?\s*</option>', '', s)
          s = re.sub(r'<[^>]+>[^<]*抹茶のダマンドクロワッサン[^<]*[¥￥]\s*350[^<]*</[^>]+>', '', s)
          s = re.sub(r'<[^>]*>\s*©\s*haruta bakery（制作デモ）.*?</[^>]+>', '', s, flags=re.S)
          s = re.sub(r'<[^>]*>\s*本ページは制作会社が作成した(?:<[^>]+>)*\**非公式の制作デモ\**.*?Instagram リンクは店舗の公開アカウント（@harutabakery2026）への外部リンクです。\s*</[^>]+>', '', s, flags=re.S)
          s = re.sub(r'本ページは制作会社が作成した.*?Instagram リンクは店舗の公開アカウント（@harutabakery2026）への外部リンクです。', '', s, flags=re.S)

          bar_texts = [
              '制作デモ（非公式）：写真はイメージ、価格・営業時間・メニューは店舗提供資料や公開情報に基づく参考値で、店舗に未確認の項目を含みます。',
              'お知らせ：企業・団体さまの外注注文、まとまった数量のご注文も承ります（【2日前】までにご相談ください）。この欄はデモ用のダミー文です。'
          ]
          for text in bar_texts:
              pos = s.find(text)
              if pos != -1:
                  start = s.rfind('<div', 0, pos)
                  end = s.find('</div>', pos)
                  if start != -1 and end != -1:
                      s = s[:start] + s[end + len('</div>'):]
                  else:
                      s = s.replace(text, '')

          def add_map(html, store_name, map_url, marker):
              if marker in html:
                  return html
              pattern = rf'(<h3>{re.escape(store_name)}</h3>\s*<table>.*?</table>)'
              iframe = (
                  f'\n<div class="store-map" style="margin-top:18px;border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.08);">'
                  f'<iframe title="{store_name} Googleマップ" src="{map_url}" width="100%" height="320" style="border:0;display:block;" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>'
                  f'</div><!-- {marker} -->'
              )
              return re.sub(pattern, lambda m: m.group(1) + iframe, html, count=1, flags=re.S)

          s = add_map(
              s,
              '久留米店',
              'https://www.google.com/maps?q=%E7%A6%8F%E5%B2%A1%E7%9C%8C%E4%B9%85%E7%95%99%E7%B1%B3%E5%B8%82%E5%96%84%E9%81%93%E5%AF%BA%E7%94%BA%E6%9C%A8%E5%A1%9A302-1&output=embed',
              'kurume-google-map'
          )
          s = add_map(
              s,
              '八女店',
              'https://www.google.com/maps?q=%E7%A6%8F%E5%B2%A1%E7%9C%8C%E5%85%AB%E5%A5%B3%E5%B8%82%E6%9C%AC%E6%9D%918&output=embed',
              'yame-google-map'
          )

          p.write_text(s, encoding='utf-8')
          PY

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy website to XServer
        timeout-minutes: 7
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -u
          for attempt in 1 2 3; do
            echo "FTP deploy attempt ${attempt}/3"
            if timeout 120s lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "
              set ftp:ssl-allow no;
              set ftp:passive-mode true;
              set net:timeout 20;
              set net:max-retries 2;
              set net:reconnect-interval-base 5;
              set net:reconnect-interval-max 20;
              mirror -R --verbose --parallel=2 --exclude-glob .git* --exclude-glob .github/ --exclude-glob .claude/ --exclude-glob .rate/ --exclude README.txt --exclude config.sample.php ./ /ciao-st.com/public_html/harutabakery/site/;
              bye
            "; then
              echo "FTP deploy succeeded"
              exit 0
            fi
            rc=$?
            echo "FTP deploy attempt ${attempt} failed or timed out (exit ${rc})"
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          echo "FTP deploy failed after 3 attempts"
          exit 1

name: Deploy to XServer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xserver-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare public files with requested fixes
        run: |
          rm -rf deploy
          mkdir -p deploy
          cp index.html submit.php deploy/
          cp -R images deploy/images
          python3 - <<'PY'
          from pathlib import Path
          p=Path('deploy/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const id='i'+(idc++); qty[id]={name:n,n:0};", "const id='i'+(idc++); qty[id]={name:n,n:0,price:p};", 1)
          old="""function refreshCount(){
  const n=Object.values(qty).reduce((s,x)=>s+x.n,0);
  selectedEl.innerHTML='選択中：<b>'+n+'</b> 点';
}"""
          new="""function refreshCount(){
  const values=Object.values(qty);
  const n=values.reduce((s,x)=>s+x.n,0);
  const total=values.reduce((s,x)=>s+(x.price==null?0:x.price*x.n),0);
  const hasMarketPrice=values.some(x=>x.n>0 && x.price==null);
  const totalText='¥'+total.toLocaleString()+(hasMarketPrice?' ＋ 時価':'')+'（税込）';
  selectedEl.innerHTML='選択中：<b>'+n+'</b> 点　｜　合計金額：<b>'+totalText+'</b>';
}"""
          if old in s:
              s=s.replace(old,new,1)
          s=s.replace('https://www.instagram.com/harutabakery2026/','https://www.instagram.com/harutabakery/')
          s=s.replace('Instagram（@harutabakery2026）','Instagram（@harutabakery）')
          p.write_text(s,encoding='utf-8')
          PY
          grep -q "合計金額" deploy/index.html
          grep -q "price:p" deploy/index.html
          test "$(grep -o 'https://www.instagram.com/harutabakery/' deploy/index.html | wc -l)" -ge 2

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy public files to XServer
        timeout-minutes: 7
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -u
          for attempt in 1 2 3; do
            echo "FTP deploy attempt ${attempt}/3"
            if timeout 120s lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "
              set ftp:ssl-allow no;
              set ftp:passive-mode true;
              set net:timeout 20;
              set net:max-retries 2;
              set net:reconnect-interval-base 5;
              set net:reconnect-interval-max 20;
              mirror -R --verbose --parallel=2 deploy/ ./;
              bye
            "; then
              echo "FTP deploy succeeded"
              exit 0
            fi
            rc=$?
            echo "FTP deploy attempt ${attempt} failed or timed out (exit ${rc})"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          exit 1

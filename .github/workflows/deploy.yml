name: Deploy to XServer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xserver-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare public files
        run: |
          rm -rf deploy
          mkdir -p deploy
          cp index.html submit.php deploy/
          cp -R images deploy/images
          python3 - <<'PY'
          from pathlib import Path
          p = Path('deploy/index.html')
          s = p.read_text(encoding='utf-8')
          target = '<p class="sub">関西でパンを学んだ湯川シェフが、2019年にくるめ緑花センターの一角ではじめた店。約400のレパートリーから、その日焼けた70種ほどが店先に並びます。並ぶパンはその日次第。企業・団体さまの外注注文にも対応しています。</p>'
          if target not in s:
              raise SystemExit('Target hero text not found')
          s = s.replace(target, '', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy public files to XServer
        timeout-minutes: 7
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -u
          for attempt in 1 2 3; do
            echo "FTP deploy attempt ${attempt}/3"
            if timeout 120s lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "
              set ftp:ssl-allow no;
              set ftp:passive-mode true;
              set net:timeout 20;
              set net:max-retries 2;
              set net:reconnect-interval-base 5;
              set net:reconnect-interval-max 20;
              mirror -R --verbose --parallel=2 deploy/ ./;
              bye
            "; then
              echo "FTP deploy succeeded"
              exit 0
            fi
            rc=$?
            echo "FTP deploy attempt ${attempt} failed or timed out (exit ${rc})"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          exit 1

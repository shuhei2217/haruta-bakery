name: Verify Clean Hero V3

on:
  push:
    branches: [ino-bankin-preview]
    paths:
      - '.github/workflows/verify-clean-hero-v3.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ino-bankin-preview
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Capture public mobile hero
        run: |
          mkdir -p verify-clean
          node - <<'NODE'
          const fs=require('fs');
          const { chromium }=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',e=>errors.push('pageerror:'+e.message));
            page.on('console',m=>{if(m.type()==='error') errors.push('console:'+m.text())});
            await page.goto('https://harutabakery.ciao-st.com/site/ino-bankin-preview/?v=20260924-1502',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(2500);
            const info=await page.evaluate(()=> {
              const hero=document.querySelector('.hero');
              const scene=document.querySelector('.hero-scene');
              const shape=document.querySelector('.hero-shape');
              const fixed=document.querySelector('.mobile-fixed');
              return {
                innerWidth,
                scrollWidth:document.documentElement.scrollWidth,
                heroHeight:Math.round(hero?.getBoundingClientRect().height||0),
                sceneImage:getComputedStyle(scene).backgroundImage,
                scenePosition:getComputedStyle(scene).backgroundPosition,
                sceneSize:getComputedStyle(scene).backgroundSize,
                shapeBackground:getComputedStyle(shape).backgroundImage,
                fixedDisplay:getComputedStyle(fixed).display,
                cssHref:document.querySelector('link[rel="stylesheet"]')?.href||''
              };
            });
            fs.writeFileSync('verify-clean/diagnostic.json',JSON.stringify({info,errors},null,2));
            await page.screenshot({path:'verify-clean/top.png',fullPage:false});
            await page.locator('.hero').screenshot({path:'verify-clean/hero.png'});
            console.log(JSON.stringify({info,errors},null,2));
            if(info.scrollWidth!==390) throw new Error('horizontal overflow '+info.scrollWidth);
            if(!info.sceneImage.includes('hero-clean-v3.png')) throw new Error('wrong hero image '+info.sceneImage);
            if(errors.length) throw new Error(errors.join(' | '));
            await browser.close();
          })();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: ino-clean-hero-v3-check
          path: verify-clean/
          retention-days: 1

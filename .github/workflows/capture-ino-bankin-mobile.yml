name: Capture Ino Bankin Mobile Screenshot

on:
  push:
    branches: [ino-bankin-preview]
    paths:
      - '.github/workflows/capture-ino-bankin-mobile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ino-bankin-preview
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Capture mobile screenshot
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:390,height:844}, deviceScaleFactor:1});
            await page.goto('https://harutabakery.ciao-st.com/site/ino-bankin-preview/', {waitUntil:'networkidle', timeout:60000});
            await page.waitForTimeout(3000);
            await page.screenshot({path:'ino-bankin-preview/live-mobile.png', fullPage:true});
            console.log('title=', await page.title());
            console.log('url=', page.url());
            console.log('bodyWidth=', await page.evaluate(()=>document.body.scrollWidth));
            console.log('innerWidth=', await page.evaluate(()=>window.innerWidth));
            await browser.close();
          })();
          NODE
          base64 -w 0 ino-bankin-preview/live-mobile.png > ino-bankin-preview/live-mobile.b64.txt
      - name: Commit screenshot text
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ino-bankin-preview/live-mobile.b64.txt
          git commit -m "Capture live mobile screenshot after animations" || exit 0
          git push origin HEAD:ino-bankin-preview
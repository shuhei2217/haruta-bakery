name: Upload Clean Hero Background

on:
  push:
    branches: [ino-bankin-preview]
    paths:
      - '.github/workflows/upload-clean-hero-background.yml'

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Download clean background
        env:
          HERO_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-a100-81f5-9ff5-592c3ed406ca/raw?se=2026-09-24T06%3A12%3A12Z&sp=r&sv=2026-02-06&sr=b&scid=0f34cb59-332c-5702-a487-d744c2e38b34&skoid=0765b554-4b90-4fa2-9d6d-0055a2427910&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T01%3A53%3A11Z&ske=2026-09-25T01%3A53%3A11Z&sks=b&skv=2026-02-06&sig=Pvtj6gXc6ReNK4n2yqUVKfmBb%2BfaWHrUcHuqxWbk/nw%3D'
        run: |
          mkdir -p upload/images
          curl -fL --retry 3 --max-time 60 "$HERO_URL" -o upload/images/hero-clean-v3.png
          test -s upload/images/hero-clean-v3.png
          file upload/images/hero-clean-v3.png
      - name: Install lftp
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y lftp >/dev/null
      - name: Upload to preview server
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ftp:ssl-allow no;
            set ftp:passive-mode true;
            mkdir -p ino-bankin-preview/images;
            mirror -R --verbose upload/images/ ./ino-bankin-preview/images/;
            bye
          "

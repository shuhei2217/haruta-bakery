name: Capture Ino Bankin Viewports

on:
  push:
    branches: [ino-bankin-preview]
    paths:
      - '.github/workflows/capture-ino-bankin-viewports.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ino-bankin-preview
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Capture live viewport slices
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
            await page.goto('https://harutabakery.ciao-st.com/site/ino-bankin-preview/',{waitUntil:'networkidle',timeout:60000});
            await page.waitForTimeout(2500);
            const ys=[0,700,1400,2100,2800,3500,4200,4900,5600];
            for(let i=0;i<ys.length;i++){
              await page.evaluate(y=>window.scrollTo(0,y),ys[i]);
              await page.waitForTimeout(500);
              await page.screenshot({path:'ino-bankin-preview/viewport-'+i+'.png',fullPage:false});
            }
            await browser.close();
          })();
          NODE
          for f in ino-bankin-preview/viewport-*.png; do base64 -w 0 "$f" > "$f.b64.txt"; done
          rm ino-bankin-preview/viewport-*.png
      - name: Commit captures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ino-bankin-preview/viewport-*.b64.txt
          git commit -m "Capture live mobile viewport slices" || exit 0
          git push origin HEAD:ino-bankin-preview

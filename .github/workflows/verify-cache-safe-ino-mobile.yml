name: Verify Cache Safe Ino Mobile

on:
  push:
    branches: [ino-bankin-preview]
    paths:
      - '.github/workflows/verify-cache-safe-ino-mobile.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ino-bankin-preview
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Verify public page
        run: |
          mkdir -p verify-cache
          node - <<'NODE'
          const fs=require('fs');
          const { chromium }=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',e=>errors.push('pageerror:'+e.message));
            page.on('console',m=>{if(m.type()==='error') errors.push('console:'+m.text())});
            await page.goto('https://harutabakery.ciao-st.com/site/ino-bankin-preview/?check=20260924-1424',{waitUntil:'networkidle',timeout:60000});
            await page.waitForTimeout(1200);
            const info=await page.evaluate(()=> {
              const hero=document.querySelector('.hero-mobile-reference');
              const heroRect=hero?.getBoundingClientRect();
              return {
                title:document.title,
                innerWidth,
                documentScrollWidth:document.documentElement.scrollWidth,
                heroDisplay:hero?getComputedStyle(hero).display:null,
                heroWidth:heroRect?Math.round(heroRect.width):0,
                heroLeft:heroRect?Math.round(heroRect.left):0,
                heroRight:heroRect?Math.round(heroRect.right):0,
                heroNaturalWidth:hero?.naturalWidth||0,
                heroNaturalHeight:hero?.naturalHeight||0,
                cssHref:document.querySelector('link[rel="stylesheet"]')?.href||'',
                scriptSrc:document.querySelector('script[src]')?.src||'',
                areaHasOldHex:!!document.querySelector('.area-map'),
                areaRegions:[...document.querySelectorAll('.area-regions span')].map(x=>x.textContent.trim())
              };
            });
            fs.writeFileSync('verify-cache/diagnostic.json',JSON.stringify({info,errors},null,2));
            await page.screenshot({path:'verify-cache/top.png',fullPage:false});
            await page.locator('.hero').screenshot({path:'verify-cache/hero.png'});
            await page.locator('#area').screenshot({path:'verify-cache/area.png'});
            console.log(JSON.stringify({info,errors},null,2));
            if(info.documentScrollWidth!==390) throw new Error('horizontal overflow '+info.documentScrollWidth);
            if(info.heroWidth!==390 || info.heroLeft!==0 || info.heroRight!==390) throw new Error('hero sizing wrong '+JSON.stringify(info));
            if(info.areaHasOldHex) throw new Error('old area map still present');
            if(errors.length) throw new Error('browser errors '+errors.join(' | '));
            await browser.close();
          })();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: ino-cache-safe-mobile-check
          path: verify-cache/
          retention-days: 1

name: Diagnose Ino Sticky

on:
  push:
    branches: [ino-bankin-preview]
    paths:
      - '.github/workflows/diagnose-ino-sticky.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ino-bankin-preview
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Diagnose sticky
        run: |
          node - <<'NODE'
          const { chromium }=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const vp of [{name:'pc',w:1440,h:1000},{name:'m390',w:390,h:844}]){
              const page=await browser.newPage({viewport:{width:vp.w,height:vp.h}});
              await page.goto('https://harutabakery.ciao-st.com/site/ino-bankin-preview/?stickyDiag=1',{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForTimeout(1400);
              const setup=await page.evaluate(()=>{
                const s=document.querySelector('.service-sticky');
                const story=document.querySelector('.service-story');
                const ancestors=[];
                let el=s;
                while(el){
                  const cs=getComputedStyle(el);
                  const r=el.getBoundingClientRect();
                  ancestors.push({
                    tag:el.tagName,
                    cls:el.className,
                    position:cs.position,
                    overflow:cs.overflow,
                    overflowX:cs.overflowX,
                    overflowY:cs.overflowY,
                    display:cs.display,
                    height:Math.round(r.height),
                    top:Math.round(r.top),
                  });
                  el=el.parentElement;
                }
                const sr=story.getBoundingClientRect();
                return {
                  scrollY,
                  storyTop:sr.top+scrollY,
                  storyHeight:sr.height,
                  stickyTop:parseFloat(getComputedStyle(s).top)||0,
                  stickyHeight:s.getBoundingClientRect().height,
                  ancestors
                };
              });
              const samples=[];
              for(const off of [0,80,180,350,550,750]){
                const y=Math.max(0,setup.storyTop+off);
                await page.evaluate(y=>scrollTo(0,y),y);
                await page.waitForTimeout(250);
                samples.push(await page.evaluate((y)=>{
                  const s=document.querySelector('.service-sticky');
                  const story=document.querySelector('.service-story');
                  const sr=s.getBoundingClientRect();
                  const pr=story.getBoundingClientRect();
                  return {
                    requested:Math.round(y),
                    actualScrollY:Math.round(scrollY),
                    stickyViewportTop:Math.round(sr.top),
                    stickyDocTop:Math.round(sr.top+scrollY),
                    storyViewportTop:Math.round(pr.top),
                    storyViewportBottom:Math.round(pr.bottom)
                  };
                },y));
              }
              console.log(JSON.stringify({vp,setup,samples},null,2));
              await page.close();
            }
            await browser.close();
          })();
          NODE

name: Verify Pexels Roof Photos

on:
  push:
    branches: [ino-bankin-preview]
    paths:
      - '.github/workflows/verify-pexels-roof-photos.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ino-bankin-preview
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Verify live page
        run: |
          mkdir -p verify
          node - <<'NODE'
          const fs=require('fs');
          const { chromium }=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
            const errors=[], bad=[];
            page.on('pageerror',e=>errors.push('pageerror:'+e.message));
            page.on('console',m=>{if(m.type()==='error') errors.push('console:'+m.text())});
            page.on('response',r=>{if(r.status()>=400) bad.push(r.status()+' '+r.url())});
            await page.goto('https://harutabakery.ciao-st.com/site/ino-bankin-preview/?v=20260924-2022',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(2200);
            const info=await page.evaluate(()=>({
              innerWidth,
              scrollWidth:document.documentElement.scrollWidth,
              heroBg:getComputedStyle(document.querySelector('.hero-scene')).backgroundImage,
              craftSrc:document.querySelector('.craft-photo img')?.getAttribute('src')||'',
              craftNatural:[document.querySelector('.craft-photo img')?.naturalWidth||0,document.querySelector('.craft-photo img')?.naturalHeight||0],
              imgErrors:[...document.images].filter(i=>!i.complete||i.naturalWidth===0).map(i=>i.src)
            }));
            await page.screenshot({path:'verify/top.png',fullPage:false});
            await page.locator('.hero').screenshot({path:'verify/hero.png'});
            await page.locator('.craft-focus').screenshot({path:'verify/craft.png'});
            fs.writeFileSync('verify/diagnostic.json',JSON.stringify({info,errors,bad},null,2));
            console.log(JSON.stringify({info,errors,bad},null,2));
            if(info.scrollWidth!==390) throw new Error('overflow '+info.scrollWidth);
            if(!info.heroBg.includes('pexels-hero-metal-roof.jpg')) throw new Error('hero not using Pexels');
            if(!info.craftSrc.includes('pexels-craft-metal-roof.jpg')) throw new Error('craft not using Pexels');
            if(info.imgErrors.length) throw new Error('image error');
            if(errors.length) throw new Error(errors.join(' | '));
            if(bad.length) throw new Error(bad.join(' | '));
            await browser.close();
          })();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: ino-pexels-roof-check
          path: verify/
          retention-days: 1

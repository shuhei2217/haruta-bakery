name: Verify Vertical Service Sticky

on:
  push:
    branches: [ino-bankin-preview]
    paths:
      - '.github/workflows/verify-vertical-service-sticky.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ino-bankin-preview

      - name: Confirm live HTML reached XServer
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --max-time 25 "https://harutabakery.ciao-st.com/site/ino-bankin-preview/?check=vertical-${attempt}" -o /tmp/live.html; then
              if grep -q 'service-vertical-title' /tmp/live.html && grep -q 'styles.css?v=20260924-2215' /tmp/live.html; then
                echo "Live XServer HTML contains the new vertical sticky markup."
                exit 0
              fi
            fi
            echo "Live check attempt ${attempt} did not confirm the new version yet."
            sleep 5
          done
          echo "Could not confirm the live HTML after retries."
          exit 1

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Verify responsive layout from deployed source files
        run: |
          mkdir -p verify
          python3 -m http.server 8000 --directory ino-bankin-preview >/tmp/ino-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node - <<'NODE'
          const fs=require('fs');
          const { chromium }=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const viewports=[
              {name:'pc',w:1440,h:1000},
              {name:'m375',w:375,h:812},
              {name:'m390',w:390,h:844},
              {name:'m430',w:430,h:900}
            ];
            const results=[];
            for(const vp of viewports){
              const page=await browser.newPage({viewport:{width:vp.w,height:vp.h},deviceScaleFactor:1});
              const errors=[];
              await page.route('**/favicon.ico', route=>route.fulfill({status:204,body:''}));
              page.on('pageerror',e=>errors.push(e.message));
              await page.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded',timeout:20000});
              await page.evaluate(()=>{document.documentElement.style.scrollBehavior='auto'});
              await page.waitForTimeout(500);

              const base=await page.evaluate(()=>({
                innerWidth,
                scrollWidth:document.documentElement.scrollWidth,
                stickyPosition:getComputedStyle(document.querySelector('.service-sticky')).position,
                writingMode:getComputedStyle(document.querySelector('.service-vertical-title')).writingMode,
                hasOldMedia:!!document.querySelector('.service-sticky-media'),
                stickyImages:document.querySelectorAll('.service-sticky img').length,
                title:document.querySelector('#serviceStickyTitle')?.textContent.trim()
              }));

              const expected=await page.locator('.service-sticky').evaluate(el=>Math.round(parseFloat(getComputedStyle(el).top)||0));
              const samples=[];
              const panels=page.locator('.service-panel');
              for(let i=0;i<3;i++){
                const p=panels.nth(i);
                const y=await p.evaluate(el=>{const r=el.getBoundingClientRect();return r.top+scrollY+r.height*.45});
                await page.evaluate(y=>scrollTo(0,Math.max(0,y-innerHeight*.35)),y);
                await page.waitForTimeout(420);
                samples.push(await page.evaluate(()=>({
                  title:document.querySelector('#serviceStickyTitle')?.textContent.trim(),
                  top:Math.round(document.querySelector('.service-sticky').getBoundingClientRect().top)
                })));
              }

              await page.evaluate(()=>scrollTo(0,0));
              await page.screenshot({path:`verify/${vp.name}-full.png`,fullPage:true});
              results.push({vp,base,expected,samples,errors});

              if(base.scrollWidth!==vp.w) throw new Error(vp.name+' overflow '+base.scrollWidth);
              if(base.hasOldMedia||base.stickyImages!==0) throw new Error(vp.name+' old sticky media remains');
              if(!['vertical-rl','tb-rl'].includes(base.writingMode)) throw new Error(vp.name+' not vertical '+base.writingMode);
              if(base.stickyPosition!=='sticky') throw new Error(vp.name+' sticky disabled');
              if(errors.length) throw new Error(vp.name+' JS errors '+errors.join(' | '));
              const titles=samples.map(x=>x.title);
              if(!titles.includes('建築板金')||!titles.includes('屋根')||!titles.includes('外壁')) throw new Error(vp.name+' title switching failed '+JSON.stringify(titles));
              if(!samples.slice(1).some(s=>Math.abs(s.top-expected)<=3)) throw new Error(vp.name+' sticky did not hold '+JSON.stringify({expected,samples}));
              await page.close();
            }
            fs.writeFileSync('verify/diagnostic.json',JSON.stringify(results,null,2));
            console.log(JSON.stringify(results,null,2));
            await browser.close();
          })();
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: ino-vertical-service-sticky-check
          path: verify/
          retention-days: 1

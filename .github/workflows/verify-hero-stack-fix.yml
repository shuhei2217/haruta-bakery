name: Verify Hero Stack Fix

on:
  push:
    branches: [ino-bankin-preview]
    paths:
      - '.github/workflows/verify-hero-stack-fix.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ino-bankin-preview
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Verify 375 and 390 widths
        run: |
          mkdir -p verify-stack
          node - <<'NODE'
          const fs=require('fs');
          const { chromium }=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const results=[];
            for (const vp of [{w:375,h:812},{w:390,h:844}]) {
              const page=await browser.newPage({viewport:{width:vp.w,height:vp.h},deviceScaleFactor:1});
              const errors=[];
              page.on('pageerror',e=>errors.push('pageerror:'+e.message));
              page.on('console',m=>{if(m.type()==='error') errors.push('console:'+m.text())});
              await page.goto('https://harutabakery.ciao-st.com/site/ino-bankin-preview/?v=20260924-1516-'+vp.w,{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForTimeout(2200);
              const info=await page.evaluate(()=> {
                const hero=document.querySelector('.hero');
                const scene=document.querySelector('.hero-scene');
                const shape=document.querySelector('.hero-shape');
                const content=document.querySelector('.hero-content');
                const after=getComputedStyle(hero,'::after');
                return {
                  innerWidth,
                  scrollWidth:document.documentElement.scrollWidth,
                  heroHeight:Math.round(hero?.getBoundingClientRect().height||0),
                  sceneZ:getComputedStyle(scene).zIndex,
                  sceneDisplay:getComputedStyle(scene).display,
                  sceneImage:getComputedStyle(scene).backgroundImage,
                  scenePosition:getComputedStyle(scene).backgroundPosition,
                  shapeZ:getComputedStyle(shape).zIndex,
                  shapeBg:getComputedStyle(shape).backgroundImage,
                  contentZ:getComputedStyle(content).zIndex,
                  afterZ:after.zIndex,
                  cssHref:document.querySelector('link[rel="stylesheet"]')?.href||''
                };
              });
              await page.screenshot({path:`verify-stack/top-${vp.w}.png`,fullPage:false});
              await page.locator('.hero').screenshot({path:`verify-stack/hero-${vp.w}.png`});
              results.push({viewport:vp,info,errors});
              if(info.scrollWidth!==vp.w) throw new Error('overflow '+vp.w+': '+info.scrollWidth);
              if(info.sceneZ!=='0' || info.shapeZ!=='2' || info.contentZ!=='3' || info.afterZ!=='1') throw new Error('stack wrong '+JSON.stringify(info));
              if(!info.sceneImage.includes('hero-clean-v3.png')) throw new Error('wrong background '+info.sceneImage);
              if(errors.length) throw new Error(errors.join(' | '));
              await page.close();
            }
            fs.writeFileSync('verify-stack/diagnostic.json',JSON.stringify(results,null,2));
            console.log(JSON.stringify(results,null,2));
            await browser.close();
          })();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: ino-hero-stack-check
          path: verify-stack/
          retention-days: 1

name: Update confirmation email layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-confirmation-email-layout.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update confirmation email
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('submit.php')
          s=p.read_text(encoding='utf-8')
          start=s.index('  $cBody = ', s.index('/* ---------- 自動確認メール ---------- */'))
          end=s.index('  $acked = sendUtf8Mail', start)
          new='''  $cBody = "{$name} 様\\n\\n{$shopName}です。このたびはご注文ありがとうございます。下記の内容で受け付けました。\\n\\n──────────\\n取扱店舗: {$shop}\\nお届け方法: {$method}\\nお届け先: {$company}\\nご住所: {$addr}\\n希望日時: {$date} {$time}\\nご担当者: {$name} 様\\n電話: {$tel}\\n──────────\\n" . implode("\\n", $lines) . "\\n──────────\\n";
          if ($note !== '') $cBody .= "備考: {$note}\\n──────────\\n";
          $cBody .= "\\nお渡しまでに2日間いただきます（【2日前】までにご依頼ください）。\\n担当より折り返しご確認のご連絡をさせていただきますのでお待ちください。\\n\\n※このメールは自動送信です。ご返信いただいても対応致しかねます。\\n\\n＜お問い合わせ＞\\nharuta bakery 久留米店　TEL 0942-27-5959\\nharuta bakery 八女店　TEL 0943-24-8001\\n";
'''
          s=s[:start]+new+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'haruta bakeryです。このたびはご注文ありがとうございます' submit.php
          grep -q 'お待ちください' submit.php
          grep -q '＜お問い合わせ＞' submit.php
          ! grep -q '※本ページは制作デモです。実際のご注文の受付は行っておりません。' submit.php
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add submit.php
          git commit -m '自動確認メール本文を指定レイアウトに変更'
          git push

name: Verify Translucent Hero Mobile

on:
  push:
    branches: [ino-bankin-preview]
    paths:
      - '.github/workflows/verify-translucent-hero-mobile.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ino-bankin-preview
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Capture public hero
        run: |
          mkdir -p verify-hero
          node - <<'NODE'
          const fs=require('fs');
          const { chromium }=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',e=>errors.push('pageerror:'+e.message));
            page.on('console',m=>{if(m.type()==='error') errors.push('console:'+m.text())});
            await page.goto('https://harutabakery.ciao-st.com/site/ino-bankin-preview/?v=20260924-1437',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(2500);
            const info=await page.evaluate(()=> {
              const shape=document.querySelector('.hero-shape');
              const scene=document.querySelector('.hero-scene');
              const ref=document.querySelector('.hero-mobile-reference');
              const hero=document.querySelector('.hero');
              return {
                innerWidth,
                scrollWidth:document.documentElement.scrollWidth,
                heroHeight:Math.round(hero?.getBoundingClientRect().height||0),
                referenceDisplay:ref?getComputedStyle(ref).display:null,
                shapeDisplay:shape?getComputedStyle(shape).display:null,
                shapeBackground:getComputedStyle(shape).backgroundImage,
                sceneDisplay:scene?getComputedStyle(scene).display:null,
                sceneBackground:getComputedStyle(scene).backgroundImage,
                cssHref:document.querySelector('link[rel="stylesheet"]')?.href||''
              };
            });
            fs.writeFileSync('verify-hero/diagnostic.json',JSON.stringify({info,errors},null,2));
            await page.screenshot({path:'verify-hero/top.png',fullPage:false});
            await page.locator('.hero').screenshot({path:'verify-hero/hero.png'});
            console.log(JSON.stringify({info,errors},null,2));
            await browser.close();
          })();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: ino-translucent-hero-check
          path: verify-hero/
          retention-days: 1

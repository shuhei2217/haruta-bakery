name: Verify Larger Service Title

on:
  push:
    branches: [ino-bankin-preview]
    paths:
      - '.github/workflows/verify-larger-service-title.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ino-bankin-preview

      - name: Confirm live CSS version
        run: |
          curl -fsSL --max-time 25 'https://harutabakery.ciao-st.com/site/ino-bankin-preview/?v=20260924-2225' -o /tmp/live.html
          grep -q 'styles.css?v=20260924-2225' /tmp/live.html

      - name: Verify mobile title size
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          mkdir -p verify
          node - <<'NODE'
          const fs=require('fs');
          const { chromium }=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            await page.goto('https://harutabakery.ciao-st.com/site/ino-bankin-preview/?v=20260924-2225',{waitUntil:'commit',timeout:30000}).catch(()=>{});
            await page.waitForSelector('.service-vertical-title',{timeout:30000});
            await page.waitForTimeout(800);
            const info=await page.evaluate(()=>({
              scrollWidth:document.documentElement.scrollWidth,
              fontSize:parseFloat(getComputedStyle(document.querySelector('.service-vertical-title')).fontSize),
              writingMode:getComputedStyle(document.querySelector('.service-vertical-title')).writingMode,
              text:document.querySelector('.service-vertical-title').textContent.trim()
            }));
            await page.locator('.service-story').screenshot({path:'verify/service-390.png'});
            fs.writeFileSync('verify/diagnostic.json',JSON.stringify(info,null,2));
            console.log(info);
            if(info.scrollWidth!==390) throw new Error('horizontal overflow');
            if(info.fontSize<37) throw new Error('title still too small: '+info.fontSize);
            if(!['vertical-rl','tb-rl'].includes(info.writingMode)) throw new Error('not vertical');
            await browser.close();
          })();
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: ino-larger-service-title-check
          path: verify/
          retention-days: 1

name: Verify Ino Bankin Mobile After Fix

on:
  push:
    branches: [ino-bankin-preview]
    paths:
      - '.github/workflows/verify-ino-bankin-mobile.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ino-bankin-preview
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Verify live page and capture
        run: |
          mkdir -p verify-output
          node - <<'NODE'
          const fs=require('fs');
          const { chromium }=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',e=>errors.push('pageerror: '+e.message));
            page.on('console',m=>{if(m.type()==='error') errors.push('console: '+m.text())});
            await page.goto('https://harutabakery.ciao-st.com/site/ino-bankin-preview/',{waitUntil:'load',timeout:30000});
            await page.waitForTimeout(2500);
            const info=await page.evaluate(()=>({
              title:document.title,
              innerWidth:window.innerWidth,
              scrollWidth:document.documentElement.scrollWidth,
              revealCount:document.querySelectorAll('.reveal').length,
              invisibleRevealCount:[...document.querySelectorAll('.reveal')].filter(el=>parseFloat(getComputedStyle(el).opacity)<0.99).length,
              bodyHeight:document.body.scrollHeight,
              headerText:document.querySelector('.brand-copy strong')?.textContent?.trim()||'',
              h1Text:document.querySelector('.headline-c')?.textContent?.trim()||''
            }));
            fs.writeFileSync('verify-output/diagnostic.json',JSON.stringify({info,errors},null,2));
            const ys=[0,650,1350,2150,3000,3900,4800,5700];
            for(let i=0;i<ys.length;i++){
              await page.evaluate(y=>window.scrollTo(0,y),ys[i]);
              await page.waitForTimeout(250);
              await page.screenshot({path:`verify-output/mobile-${i}.png`,fullPage:false});
            }
            await browser.close();
          })();
          NODE
          cat verify-output/diagnostic.json
      - uses: actions/upload-artifact@v4
        with:
          name: ino-bankin-mobile-verification
          path: verify-output/
          retention-days: 1

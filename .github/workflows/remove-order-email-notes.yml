name: Remove order email notes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-order-email-notes.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove requested text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('submit.php')
          s=p.read_text(encoding='utf-8')
          s=s.replace('ご注文は事前注文です。担当より折り返しご確認のご連絡をさせていただきます。\\n', '担当より折り返しご確認のご連絡をさせていただきます。\\n')
          s=s.replace('配達可能日は Instagram（@harutabakery2026）でご確認ください。\\n', '')
          p.write_text(s,encoding='utf-8')
          PY
          ! grep -q 'ご注文は事前注文です。' submit.php
          ! grep -q '配達可能日は Instagram（@harutabakery2026）でご確認ください。' submit.php
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add submit.php
          git commit -m '注文確認メールの案内文を削除'
          git push

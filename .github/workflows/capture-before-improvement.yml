name: Capture Ino Before Improvement

on:
  push:
    branches: [ino-bankin-preview]
    paths:
      - '.github/workflows/capture-before-improvement.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ino-bankin-preview
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Capture full pages
        run: |
          mkdir -p before
          node - <<'NODE'
          const fs=require('fs');
          const { chromium }=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const results=[];
            for (const vp of [{name:'pc',w:1440,h:1000},{name:'mobile',w:390,h:844}]) {
              const page=await browser.newPage({viewport:{width:vp.w,height:vp.h},deviceScaleFactor:1});
              const errors=[];
              page.on('pageerror',e=>errors.push('pageerror:'+e.message));
              page.on('console',m=>{if(m.type()==='error') errors.push('console:'+m.text())});
              await page.goto('https://harutabakery.ciao-st.com/site/ino-bankin-preview/?before=1',{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForTimeout(1800);
              const info=await page.evaluate(()=>({
                innerWidth,
                scrollWidth:document.documentElement.scrollWidth,
                scrollHeight:document.documentElement.scrollHeight,
                faqCount:document.querySelectorAll('#faq details').length,
                telCount:document.querySelectorAll('a[href^="tel:"]').length,
                servicesRect:document.querySelector('#services')?.getBoundingClientRect().toJSON?.()||null
              }));
              await page.screenshot({path:`before/${vp.name}-full.png`,fullPage:true});
              results.push({vp,info,errors});
              await page.close();
            }
            fs.writeFileSync('before/diagnostic.json',JSON.stringify(results,null,2));
            console.log(JSON.stringify(results,null,2));
            await browser.close();
          })();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: ino-before-improvement
          path: before/
          retention-days: 1

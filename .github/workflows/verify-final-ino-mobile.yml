name: Verify Final Ino Mobile Layout

on:
  push:
    branches: [ino-bankin-preview]
    paths:
      - '.github/workflows/verify-final-ino-mobile.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ino-bankin-preview
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Capture live mobile
        run: |
          mkdir -p verify-final
          node - <<'NODE'
          const fs=require('fs');
          const { chromium }=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            page.on('console',m=>{if(m.type()==='error') errors.push(m.text())});
            await page.goto('https://harutabakery.ciao-st.com/site/ino-bankin-preview/',{waitUntil:'networkidle',timeout:60000});
            await page.waitForTimeout(1500);
            const info=await page.evaluate(()=>({
              title:document.title,
              innerWidth:innerWidth,
              scrollWidth:document.documentElement.scrollWidth,
              heroImgSrc:document.querySelector('.hero-mobile-reference')?.getAttribute('src')||null,
              heroImgNaturalWidth:document.querySelector('.hero-mobile-reference')?.naturalWidth||0,
              heroImgNaturalHeight:document.querySelector('.hero-mobile-reference')?.naturalHeight||0,
              areaText:document.querySelector('#area')?.innerText?.replace(/\s+/g,' ').trim().slice(0,300)||''
            }));
            fs.writeFileSync('verify-final/diagnostic.json',JSON.stringify({info,errors},null,2));
            await page.screenshot({path:'verify-final/top.png',fullPage:false});
            await page.locator('.hero').screenshot({path:'verify-final/hero.png'});
            await page.locator('#area').screenshot({path:'verify-final/area.png'});
            await browser.close();
          })();
          NODE
          cat verify-final/diagnostic.json
      - uses: actions/upload-artifact@v4
        with:
          name: ino-final-mobile-check
          path: verify-final/
          retention-days: 1

name: Verify Safe Copy Final

on:
  push:
    branches: [ino-bankin-preview]
    paths:
      - '.github/workflows/verify-safe-copy-final.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ino-bankin-preview
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Wait for new public version and verify
        run: |
          mkdir -p verify-safe
          node - <<'NODE'
          const fs=require('fs');
          const { chromium }=require('playwright');
          const url='https://harutabakery.ciao-st.com/site/ino-bankin-preview/?safe=20260924-1914';
          (async()=>{
            const browser=await chromium.launch({headless:true});

            // Wait up to 8 minutes for the new copy to reach XServer.
            let ready=false, lastText='';
            for(let i=0;i<32;i++){
              const p=await browser.newPage({viewport:{width:390,height:844}});
              try{
                await p.goto(url+'&probe='+i,{waitUntil:'commit',timeout:20000});
                await p.waitForSelector('body',{timeout:15000});
                lastText=await p.locator('body').innerText();
                if(lastText.includes('金属部分のサビ') && lastText.includes('小さな症状でも相談できますか？')){
                  ready=true;
                  await p.close();
                  break;
                }
              }catch(e){}
              await p.close();
              await new Promise(r=>setTimeout(r,15000));
            }
            if(!ready) throw new Error('new public version did not appear in time');

            const viewports=[
              {name:'pc',w:1440,h:1000},
              {name:'m375',w:375,h:812},
              {name:'m390',w:390,h:844},
              {name:'m430',w:430,h:900}
            ];
            const results=[];
            for(const vp of viewports){
              const page=await browser.newPage({viewport:{width:vp.w,height:vp.h},deviceScaleFactor:1});
              const errors=[], bad=[];
              page.on('pageerror',e=>errors.push('pageerror:'+e.message));
              page.on('console',m=>{if(m.type()==='error') errors.push('console:'+m.text())});
              page.on('response',r=>{if(r.status()>=400) bad.push(r.status()+' '+r.url())});
              await page.goto(url+'&vp='+vp.w,{waitUntil:'commit',timeout:30000}).catch(()=>{});
              await page.waitForFunction(()=>document.querySelector('.service-story')&&document.querySelector('#faq')&&document.querySelector('#contact'),null,{timeout:30000});
              await page.evaluate(()=>{document.documentElement.style.scrollBehavior='auto'});
              await page.waitForTimeout(1200);

              const pageHeight=await page.evaluate(()=>document.documentElement.scrollHeight);
              for(let y=0;y<pageHeight;y+=Math.max(450,Math.floor(vp.h*.72))){
                await page.evaluate(y=>scrollTo(0,y),y);
                await page.waitForTimeout(80);
              }
              await page.evaluate(()=>scrollTo(0,0));
              await page.waitForTimeout(180);

              const base=await page.evaluate(()=>{
                const body=document.body.innerText;
                const forbidden=['雨漏り','雨樋','カバー工法','葺き替え','完全自社施工','無料見積もり','現地調査無料','相見積もり','保証','要確認','第三者掲載'];
                const sticky=document.querySelector('.service-sticky');
                const scroll=document.querySelector('.service-scroll');
                return {
                  innerWidth,
                  scrollWidth:document.documentElement.scrollWidth,
                  faqCount:document.querySelectorAll('#faq details').length,
                  forbidden:forbidden.filter(x=>body.includes(x)),
                  hasNewConcern:body.includes('金属部分のサビ'),
                  hasSafeStrength:body.includes('屋根・外壁をまとめて相談'),
                  tel:[...document.querySelectorAll('a[href^="tel:"]')].map(a=>a.getAttribute('href')),
                  stickyPosition:getComputedStyle(sticky).position,
                  leftBasis:getComputedStyle(sticky).flexBasis,
                  rightBasis:getComputedStyle(scroll).flexBasis,
                  serviceFont:parseFloat(getComputedStyle(document.querySelector('.service-panel p:not(.service-no)')).fontSize),
                  imageErrors:[...document.images].filter(i=>!i.complete||i.naturalWidth===0).map(i=>i.src)
                };
              });

              const faq=page.locator('#faq details').first();
              await faq.locator('summary').click();
              const faqOpen=await faq.evaluate(el=>el.open);

              let menuOk=true;
              if(vp.w<=430){
                await page.locator('.menu-button').click();
                menuOk=await page.locator('.drawer').evaluate(el=>el.classList.contains('open'));
                await page.locator('.drawer-close').click();
              }

              const metrics=await page.locator('.service-story').evaluate(el=>{
                const r=el.getBoundingClientRect(); return {top:r.top+scrollY,height:r.height};
              });
              const expected=await page.locator('.service-sticky').evaluate(el=>Math.round(parseFloat(getComputedStyle(el).top)||0));
              const samples=[];
              for(const off of [180,350,500]){
                const y=Math.max(0,metrics.top+Math.min(off,metrics.height*.52));
                await page.evaluate(y=>scrollTo(0,y),y);
                await page.waitForTimeout(120);
                samples.push(await page.evaluate(()=>{
                  const s=document.querySelector('.service-sticky');
                  return {top:Math.round(s.getBoundingClientRect().top),actualScrollY:Math.round(scrollY)};
                }));
              }
              const stuck=samples.filter(s=>Math.abs(s.top-expected)<=3).length>=2;

              await page.evaluate(()=>scrollTo(0,0));
              await page.screenshot({path:`verify-safe/${vp.name}-full.png`,fullPage:true});

              results.push({vp,base,faqOpen,menuOk,expected,samples,stuck,errors,bad});

              if(base.scrollWidth!==vp.w) throw new Error(vp.name+' overflow '+base.scrollWidth);
              if(base.forbidden.length) throw new Error(vp.name+' forbidden '+base.forbidden.join(','));
              if(!base.hasNewConcern||!base.hasSafeStrength) throw new Error(vp.name+' new copy missing');
              if(!base.tel.includes('tel:0582948544')) throw new Error(vp.name+' phone missing');
              if(base.faqCount!==4||!faqOpen) throw new Error(vp.name+' FAQ failed');
              if(!menuOk) throw new Error(vp.name+' menu failed');
              if(!stuck) throw new Error(vp.name+' sticky failed '+JSON.stringify({expected,samples}));
              if(base.imageErrors.length) throw new Error(vp.name+' image errors '+base.imageErrors.join(','));
              if(errors.length) throw new Error(vp.name+' JS '+errors.join(' | '));
              if(bad.length) throw new Error(vp.name+' HTTP '+bad.join(' | '));
            }

            const nojs=await browser.newPage({viewport:{width:390,height:844},javaScriptEnabled:false});
            await nojs.goto(url+'&nojs=1',{waitUntil:'commit',timeout:30000}).catch(()=>{});
            await nojs.waitForSelector('.service-panel',{timeout:30000});
            const nojsOk=await nojs.evaluate(()=>[
              document.querySelector('#services')?.innerText.includes('建築板金'),
              document.querySelector('#company')?.innerText.includes('井野板金工業株式会社'),
              document.querySelector('#faq')?.innerText.includes('よくあるご質問'),
              document.querySelector('#contact')?.innerText.includes('058-294-8544')
            ].every(Boolean));
            if(!nojsOk) throw new Error('no-JS content failed');
            await nojs.close();

            fs.writeFileSync('verify-safe/diagnostic.json',JSON.stringify({results,nojsOk},null,2));
            console.log(JSON.stringify({results,nojsOk},null,2));
            await browser.close();
          })();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: ino-safe-copy-final
          path: verify-safe/
          retention-days: 1

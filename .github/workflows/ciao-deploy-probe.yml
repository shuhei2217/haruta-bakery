name: Probe ciao XServer path

on:
  push:
    branches: [ciao-official-site]
    paths:
      - ".github/workflows/ciao-deploy-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install lftp
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y lftp >/dev/null
      - name: Inspect ciao-st.com directory
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -e
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ftp:ssl-allow no;
            set ftp:passive-mode true;
            set net:timeout 20;
            echo '--- root ---';
            pwd;
            cls -1;
            echo '--- ciao-st.com ---';
            cd ciao-st.com;
            pwd;
            cls -1;
            echo '--- ciao-st.com/public_html ---';
            cd public_html;
            pwd;
            cls -1;
            bye
          "
